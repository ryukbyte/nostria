<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nostra - Contact Us</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>


    <!-- NAVBAR -->

    <nav class="navbar">

        <h1 class="logo">Nostra</h1>

        <div class="nav-links" id="navLinks">

            <a href="index.html">
                Home
            </a>

            <a href="collections.html">
                Collections
            </a>

            <a href="contact.html">
                Contact Us
            </a>

        </div>

        <button id="menuButton" class="menu-button">
            ☰
        </button>

    </nav>


    <!-- PAGE HEADING -->

    <section class="page-heading">

        <p class="small-title">
            GET IN TOUCH
        </p>

        <h1>Contact Us</h1>

        <p>
            We would love to hear from you.
        </p>

    </section>


    <!-- CONTACT FORM -->

    <section class="contact-section">


        <div class="contact-information">

            <p class="small-title">
                NOSTRA SUPPORT
            </p>

            <h2>
                Let's Talk.
            </h2>

            <p>
                Have a question about our products?
                Fill out the form and send us a message.
            </p>

        </div>


        <form id="contactForm" class="contact-form" novalidate>


            <!-- NAME -->

            <div class="form-group">

                <label for="name">
                    Name
                </label>

                <input type="text" id="name" placeholder="Enter your name">

                <p id="nameError" class="error"></p>

            </div>


            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input type="text" id="email" placeholder="Enter your email">

                <p id="emailError" class="error"></p>

            </div>


            <!-- PHONE -->

            <div class="form-group">

                <label for="phone">
                    Phone Number
                </label>

                <input type="text" id="phone" maxlength="10" placeholder="10 digit phone number">

                <p id="phoneError" class="error"></p>

            </div>


            <!-- SUBJECT -->

            <div class="form-group">

                <label for="subject">
                    Subject
                </label>

                <input type="text" id="subject" placeholder="Enter subject">

                <p id="subjectError" class="error"></p>

            </div>


            <!-- RADIO BUTTONS -->

            <div class="form-group">

                <label>
                    Preferred Contact Method
                </label>


                <div class="radio-group">

                    <label>

                        <input type="radio" name="contactMethod" value="Email">

                        Email

                    </label>


                    <label>

                        <input type="radio" name="contactMethod" value="Phone">

                        Phone

                    </label>


                    <label>

                        <input type="radio" name="contactMethod" value="WhatsApp">

                        WhatsApp

                    </label>

                </div>

            </div>


            <!-- CHECKBOXES -->

            <div class="form-group">

                <label>
                    What are you interested in?
                </label>


                <div class="checkbox-group">

                    <label>

                        <input type="checkbox" name="interest" value="Men">

                        Men's Fashion

                    </label>


                    <label>

                        <input type="checkbox" name="interest" value="Women">

                        Women's Fashion

                    </label>


                    <label>

                        <input type="checkbox" name="interest" value="Shoes">

                        Shoes

                    </label>


                    <label>

                        <input type="checkbox" name="interest" value="Accessories">

                        Accessories

                    </label>

                </div>

            </div>


            <!-- MESSAGE -->

            <div class="form-group">

                <label for="message">
                    Message
                </label>

                <textarea id="message" maxlength="200" placeholder="Write your message..."></textarea>


                <div class="message-info">

                    <p id="messageError" class="error">
                    </p>
                </div>

            </div>


            <!-- SUBMIT -->

            <button type="submit" id="submitButton" class="main-button">
                Submit
            </button>


            <p id="successMessage" class="success">
            </p>


        </form>

    </section>


    <footer>

        <h2>Nostra</h2>

        <p>
            Simple style. Everyday confidence.
        </p>

        <p>
            &copy; 2026 Nostra
        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
